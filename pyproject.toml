[project]
name = "adk-lab"
version = "0.1.0"
description = "SkilledDragon minilab: Google ADK 2.11 eval with keyless ScriptedLlm scorecard"
readme = "README.md"
authors = [{ name = "SkilledDragon LLC", email = "hello@skilleddragon.com" }]
requires-python = ">=3.12"
dependencies = [
    "google-adk[eval]==2.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pip-audit>=2.7.0",
]

[project.scripts]
adk-lab = "adk_lab.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = true
override-dependencies = [
    "cryptography==46.0.7",
    "litellm>=1.96.2",
    "nltk>=3.9.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["adk_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "e2e: keyless ADK eval via adk CLI (slow import)",
]
