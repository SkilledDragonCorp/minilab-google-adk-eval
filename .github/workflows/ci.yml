name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.10.3"

      - name: Install Python deps
        run: uv sync --extra dev

      - name: Ruff lint
        run: uv run ruff check src tests

      - name: Mypy
        run: uv run mypy src/adk_lab

      - name: Unit tests
        run: uv run pytest tests -m "not e2e" -q

      - name: Keyless E2E eval
        run: uv run pytest tests -m e2e -q
        env:
          PYTHONPATH: src

      - name: Skills layout
        run: bash scripts/check-skills-layout.sh

      - name: pip-audit
        run: bash scripts/pip-audit.sh

      - name: Install gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Gitleaks
        run: gitleaks dir --redact --exit-code 1 .
